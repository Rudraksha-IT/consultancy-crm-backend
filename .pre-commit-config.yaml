# Hooks run the tool versions pinned in uv.lock, so local and CI results match.
# Install all three kinds once after cloning: uv run pre-commit install
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false
      # Conventional Commits, and no AI credited as co-author (scripts/check_commit_message.py).
      - id: commit-message
        name: commit message
        entry: python3 scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
      # A model changed but its migration wasn't made. Runs only when a models file is committed.
      # Pushing runs no checks (product owner, 2026-11-18): everything is checked at commit, and on CI.
      - id: migrations
        name: missing migrations
        entry: uv run python manage.py makemigrations --check --dry-run
        language: system
        files: (^|/)models(\.py|/)
        pass_filenames: false
