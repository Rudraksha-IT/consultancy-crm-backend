[project]
name = "consultancy-crm-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40",
    "cryptography>=46",
    "django>=5.2,<5.3",
    "django-tenants>=4.0.1",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "pyotp>=2.9",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.123",
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "freezegun>=1.5.5",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# The local demo script stays a plain script; its command (seed_demo) is linted and tested.
extend-exclude = ["demo/acme_seed.py"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "C4", "C90", "SIM", "RET", "PTH", "DJ", "PL", "RUF", "ANN", "D", "LOG", "G", "BLE", "TRY400"]
ignore = ["D100", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D101", "D102", "PLR2004"]
"**/migrations/**" = ["D", "E501", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["access", "applications", "auth_tokens", "batches", "catalogue", "codes", "commission", "communication", "config", "configuration", "documents", "emails", "expenses", "fees", "history", "modules", "operations", "payments", "platform_admin", "staff", "students", "tasks", "tenancy", "tests", "two_factor"]

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["\\.venv/", "^demo/acme_seed\\.py$"]

[[tool.mypy.overrides]]
# django-tenants ships no type information.
module = ["django_tenants.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# gunicorn ships no type information (only its log setup is used, in a test).
module = ["gunicorn.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "--strict-markers --cov --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["access", "applications", "auth_tokens", "batches", "catalogue", "central_login", "codes", "commission", "communication", "config", "configuration", "documents", "emails", "expenses", "fees", "history", "modules", "operations", "payments", "platform_admin", "staff", "notifications", "students", "tasks", "tenancy", "home", "visits", "reports", "office_networks", "clock_in", "transfer_requests", "jobs", "two_factor"]
omit = ["*/migrations/*", "config/wsgi.py", "config/asgi.py", "manage.py"]
